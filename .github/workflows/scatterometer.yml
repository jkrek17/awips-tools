# Data for the scatterometer page (/scatterometer/, marine_wind/scat/build.py): the latest
# NOAA STAR scatterometer passes (OSCAT-3, Metop-B and -C coastal ultra-high-resolution
# ASCAT) and Remote Sensing Systems (RSS) open-ocean ASCAT over the two OPC basins, gridded
# at 0.25 degree, with the marine wind page's Best Wind and warning lines for the same time
# and per-pass scores.
#
# Hourly at :50 (STAR posts passes 3-4 h after they are observed) and after every "Marine
# wind data" run (the cron alone has not fired on schedule): lists today and
# yesterday, downloads only the passes not already handled (the previous state is the
# branch itself), reads the newest marine wind run from marine-wind-live and keeps its Best
# Wind and warning areas (steps 6-54, two basin boxes) for 4 days so each pass is scored
# against the run the desk had and the runs 24 and 48 h earlier. It also stitches the passes
# within +-3 h of each synoptic time (00/06/12/18Z) of the last 7 days into one mosaic per
# basin (data/mosaic/), with the Best Wind and warning areas of the whole basin and one score. If no pass and no marine
# wind run is new, the run stops without pushing. Otherwise data/ and cache/ are the single
# commit of the orphan branch scatterometer-data, force-pushed (about 1-2 MB for the week),
# and Publish public site serves data/ at /scatterometer/data/. Main is never touched.
#
# +24 h and +48 h come from the cache when it holds that cycle; otherwise from the marine
# wind job's forecast record artifacts (about 90 MB each, at most 40 downloads a run, so a
# first run fills in over a few hours), and passes already published get those leads
# filled in later.
#
# RSS ASCAT is posted about 2-5 days after the day ends, one file per satellite and day
# (1-3 MB gzipped, at most about 20 asked for per run, a day not posted yet at most once an
# hour); a day is used once both Metop-B and -C are there (or it is 7 days old) and the
# mosaics of its window are rebuilt.
#
# NESDIS Metop-B ASCAT (NOAA ERDDAP, about 1 h after the pass): today, yesterday and any day of
# the window not final and not covered by RSS, at most 6 requests of 2-5 MB a run when nothing
# is old; a pass that gained cells is replaced under its id and its mosaics rebuilt.
#
# KNMI Metop-C ASCAT 25 km (NASA PO.DAAC, listed about 2.5-4 h after the orbit starts; needs the repo secrets
# EARTHDATA_TOKEN (preferred; made on the Earthdata profile page) or EARTHDATA_USER and EARTHDATA_PASS, given to the Build step only; without them the source is skipped with one log line):
# the granules of the last 2 days plus any older day RSS has not covered with Metop-C, at most 30 downloads of about
# 1 MB a run, each one real pass. The log carries a "KNMI self-check" (units, direction convention, bias against RSS
# Metop-C and NESDIS Metop-B where they overlap).
#
# By hand (Actions > Scatterometer data > Run workflow): `days` lists that many days back
# (0-8) to fill a gap; `knmi_days` takes the KNMI granules of that many days back (default 2), also on days RSS has
# already posted, so the log can compare KNMI Metop-C with RSS Metop-C (those granules are compared, not kept); the
# server keeps about a month.

name: Scatterometer data

on:
  schedule:
    - cron: '50 * * * *'
  workflow_run:
    workflows: ['Marine wind data']
    types: [completed]
  workflow_dispatch:
    inputs:
      days:
        description: 'Days back from today to list (0-8)'
        required: false
        default: '1'
      knmi_days:
        description: 'KNMI Metop-C: days back to take granules from, also where RSS has the day (self-check backfill; 0-8)'
        required: false
        default: '2'

permissions:
  contents: write
  actions: read   # lists and downloads the forecast record artifacts (marine_wind/pipeline/record.py)

concurrency:
  group: scatterometer-data
  cancel-in-progress: false

jobs:
  build:
    # after a marine wind run, only when that run succeeded (it is the run that moves marine-wind-live)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: marine_wind/scat/requirements.txt

      - name: Install dependencies
        run: pip install -r marine_wind/scat/requirements.txt

      - name: Fetch the previous state and the marine wind run
        run: |
          state="$RUNNER_TEMP/state"
          live="$RUNNER_TEMP/live"
          rm -rf "$state" "$live"
          mkdir -p "$state" "$live"
          if git fetch -q --depth 1 origin scatterometer-data 2>/dev/null; then
            git --work-tree="$state" checkout FETCH_HEAD -- . 2>/dev/null || true
            git reset -q
          else
            echo "no scatterometer-data branch yet"
          fi
          if git fetch -q --depth 1 origin marine-wind-live 2>/dev/null; then
            git --work-tree="$live" checkout FETCH_HEAD -- 'latest/global/manifest.json' 'latest/global/f*/best.gz' 'latest/global/f*/warn.gz'
            git reset -q
          fi
          test -f "$live/latest/global/manifest.json" || { echo "::error::no marine wind run on marine-wind-live"; exit 1; }

      - name: Test
        run: |
          python3 marine_wind/scat/test_build.py
          python3 -m pip install -q pytest
          python3 -m pytest -q nwp/tests/test_podaac_ascat.py

      - name: Build
        env:
          DAYS: ${{ github.event.inputs.days || '1' }}
          KNMI_DAYS: ${{ github.event.inputs.knmi_days || '2' }}
          GITHUB_TOKEN: ${{ github.token }}
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          python3 marine_wind/scat/build.py --live "$RUNNER_TEMP/live" --state "$RUNNER_TEMP/state" \
            --out "$RUNNER_TEMP/out" --days "$DAYS" --knmi-days "$KNMI_DAYS" --changed-file "$RUNNER_TEMP/changed"
          du -sh "$RUNNER_TEMP/out/data" "$RUNNER_TEMP/out/cache"

      - name: Publish to the scatterometer-data branch
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if [ "$(cat "$RUNNER_TEMP/changed")" != "true" ]; then
            echo "No new pass and no new marine wind run; nothing to publish."
            exit 0
          fi
          cd "$RUNNER_TEMP/out"
          git init -q
          git checkout -q --orphan scatterometer-data
          git config user.name "scatterometer-data"
          git config user.email "scatterometer-data@users.noreply.github.com"
          git add data cache
          git commit -q -m "Scatterometer data $(date -u +%Y-%m-%dT%H:%MZ), $(python3 -c 'import json; d=json.load(open("data/index.json")); print(len(d["passes"]), "passes, marine wind run", d["cycle"])')"
          git push -q -f "$REMOTE" scatterometer-data
