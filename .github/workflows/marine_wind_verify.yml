# Daily verification of the marine wind blend for the North Atlantic and the
# North Pacific (marine_wind/verify/verify.py). After the 12 UTC GFS and ECMWF
# analyses and the GDAS marine observation file are on AWS, the +24 to +120 h
# forecasts valid at 12 UTC today are rebuilt from the AWS mirrors and scored
# against the analyses, buoys and ships. One row per basin, lead, method and
# referee is added to scores.csv, and summary.md (last 7 days, last 30 days,
# all) is regenerated.
#
# Both files are the single commit of the orphan branch marine-wind-verify,
# force-pushed each run, so main is never touched and the branch never grows
# history. Run it by hand with a start date to backfill past days.

name: Marine wind verification

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Backfill from YYYYMMDD through today (blank: today only)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: marine-wind-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: marine_wind/verify/requirements.txt

      - name: Install dependencies
        run: pip install -r marine_wind/verify/requirements.txt

      - name: Get the scores so far
        run: |
          mkdir -p "$RUNNER_TEMP/v"
          if git fetch -q origin marine-wind-verify 2>/dev/null; then
            git show FETCH_HEAD:scores.csv > "$RUNNER_TEMP/v/scores.csv"
          fi

      - name: Verify
        working-directory: marine_wind/verify
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          v="$RUNNER_TEMP/v"
          today=$(date -u +%Y%m%d)
          d=${START:-$today}
          while [ "$d" -le "$today" ]; do
            if python3 verify.py --valid "$d" --out "$v/new_$d.csv"; then
              python3 - "$v/scores.csv" "$v/new_$d.csv" "$d" <<'PY'
          import csv, os, sys
          old, new, day = sys.argv[1:]
          rows = [r for r in csv.DictReader(open(old))] if os.path.exists(old) else []
          rows = [r for r in rows if r["valid"] != day] + list(csv.DictReader(open(new)))
          rows.sort(key=lambda r: (r["valid"], r["basin"], int(r["lead"]), r["method"], r["referee"]))
          with open(old, "w", newline="") as f:
              w = csv.DictWriter(f, list(csv.DictReader(open(new)).fieldnames))
              w.writeheader(); w.writerows(rows)
          PY
            else
              echo "::warning::no verification for $d"
            fi
            d=$(date -u -d "$d + 1 day" +%Y%m%d)
          done
          python3 verify.py --summary "$v/scores.csv" --md "$v/summary.md"

      - name: Publish to the marine-wind-verify branch
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          v="$RUNNER_TEMP/v"
          test -f "$v/scores.csv" || { echo "nothing to publish"; exit 0; }
          work="$RUNNER_TEMP/branch"
          rm -rf "$work"; mkdir -p "$work"
          cp "$v/scores.csv" "$v/summary.md" "$work/"
          cd "$work"
          git init -q
          git checkout -q --orphan marine-wind-verify
          git config user.name "marine-wind-verify"
          git config user.email "marine-wind-verify@users.noreply.github.com"
          git add scores.csv summary.md
          git commit -q -m "Marine wind verification through $(tail -n 1 scores.csv | cut -d, -f1)"
          git push -q -f "$REMOTE" marine-wind-verify
