# Data for the marine wind page (marine_wind/pipeline/build.py): the whole globe
# under latest/global/ (what the page shows), plus the two OPC boxes cut from it
# in the older per-basin format, the North Atlantic under latest/ and the North
# Pacific under latest/npac/, and a first-guess High Seas Forecast text drafted
# from the Pacific box under latest/hsf/.
# Every model run (00, 06, 12 and 18 UTC): the job checks every hour at :30,
# and once a cycle's ECMWF ensemble +120 h is on the AWS open-data mirror
# (about 7-8 h after the cycle), the newest cycle with GFS, GEFS, ECMWF IFS,
# AIFS and ENS all complete is built into a manifest and one small binary per
# lead time, and published as the single commit of the orphan branch
# marine-wind-live under latest/. If that cycle is already published, the run
# stops after the check (under a minute). Checking hourly rather than at four
# fixed times means a run GitHub's scheduler skips or starts late costs an
# hour, not six. Publish public site copies it to /marine-wind/data/ (and
# skips the runs that published nothing).
#
# The branch is rebuilt from nothing and force-pushed every run (about 50 MB),
# so it never accumulates history, and main is never touched. Run it by hand
# (Actions > Marine wind data > Run workflow) with a cycle to publish a
# particular run.

name: Marine wind data

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Cycle YYYYMMDDHH, 00, 06, 12 or 18 (blank: the newest complete cycle)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: marine-wind
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: marine_wind/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r marine_wind/pipeline/requirements.txt

      - name: Check for a new cycle
        id: check
        working-directory: marine_wind/pipeline
        env:
          CYCLE: ${{ github.event.inputs.cycle }}
        run: |
          if [ -n "$CYCLE" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          newest=$(MARINE_DOMAIN=glob python3 -c 'import build; print(build.newest_cycle())' || true)
          published=""
          if git fetch -q --depth 1 origin marine-wind-live 2>/dev/null; then
            published=$(git show FETCH_HEAD:latest/global/manifest.json | python3 -c 'import json,sys; c=json.load(sys.stdin)["cycle"]; print(c[0:4]+c[5:7]+c[8:10]+c[11:13])' || true)
          fi
          echo "newest complete $newest, published ${published:-none}"
          if [ -z "$newest" ] || [ "$newest" = "$published" ]; then echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        id: build
        if: steps.check.outputs.build == 'true'
        working-directory: marine_wind/pipeline
        env:
          CYCLE: ${{ github.event.inputs.cycle }}
        run: |
          out="$RUNNER_TEMP/marine-wind"
          rm -rf "$out"
          args=(--domain glob --out "$out/global" --boxes "$out" --record "$RUNNER_TEMP/record")
          if [ -n "$CYCLE" ]; then args+=(--cycle "$CYCLE"); fi
          python3 build.py "${args[@]}"
          rm -f "$out"/global/f*.json
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "cycle=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cycle"])' "$out/manifest.json")" >> "$GITHUB_OUTPUT"
          echo "cycle_id=$(python3 -c 'import json,sys; c=json.load(open(sys.argv[1]))["cycle"]; print(c[0:4]+c[5:7]+c[8:10]+c[11:13])' "$out/manifest.json")" >> "$GITHUB_OUTPUT"

      # The page's own forecasts at +24..+120 h (build.py --record), one artifact per lead, for the
      # verification jobs (marine_wind/pipeline/record.py). Kept outside $out, so never published.
      # A failure here never holds up the page.
      - name: Keep the forecast record +24 h
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: forecast-record-${{ steps.build.outputs.cycle_id }}-f024
          path: |
            ${{ runner.temp }}/record/f024.npz
            ${{ runner.temp }}/record/f024.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the forecast record +48 h
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: forecast-record-${{ steps.build.outputs.cycle_id }}-f048
          path: |
            ${{ runner.temp }}/record/f048.npz
            ${{ runner.temp }}/record/f048.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the forecast record +72 h
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: forecast-record-${{ steps.build.outputs.cycle_id }}-f072
          path: |
            ${{ runner.temp }}/record/f072.npz
            ${{ runner.temp }}/record/f072.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the forecast record +96 h
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: forecast-record-${{ steps.build.outputs.cycle_id }}-f096
          path: |
            ${{ runner.temp }}/record/f096.npz
            ${{ runner.temp }}/record/f096.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the forecast record +120 h
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: forecast-record-${{ steps.build.outputs.cycle_id }}-f120
          path: |
            ${{ runner.temp }}/record/f120.npz
            ${{ runner.temp }}/record/f120.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore

      # First-guess High Seas Forecast text from the North Pacific box just built
      # (marine_wind/hsf/), plus GFS-Wave seas. Never holds up the wind page:
      # a failure here leaves the draft out of this run and publishes the rest.
      - name: High seas text draft
        if: steps.check.outputs.build == 'true'
        continue-on-error: true
        working-directory: marine_wind/hsf
        env:
          OUT: ${{ steps.build.outputs.out }}
          MARINE_DOMAIN: npac
        run: python3 build_hsf.py --box "$OUT/npac" --basin pac --out "$OUT/hsf"

      - name: Publish to the marine-wind-live branch
        if: steps.check.outputs.build == 'true'
        env:
          CYCLE: ${{ steps.build.outputs.cycle }}
          OUT: ${{ steps.build.outputs.out }}
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          work="$RUNNER_TEMP/marine-wind-live"
          rm -rf "$work"
          mkdir -p "$work/latest"
          cp -r "$OUT"/. "$work/latest/"
          cd "$work"
          git init -q
          git checkout -q --orphan marine-wind-live
          git config user.name "marine-wind-live"
          git config user.email "marine-wind-live@users.noreply.github.com"
          git add -A
          git commit -q -m "Marine wind data $CYCLE"
          git remote add origin "$REMOTE"
          git push --force origin marine-wind-live
