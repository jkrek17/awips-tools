# Publishes the public web site to the separate public repository (the
# repository variable PUBLIC_SITE_REPO, for example jkrek17/web) so that this
# repository can be private. The site is assembled from the
# North Atlantic and North Pacific marine wind page (marine_wind/page/, served at /marine-wind/
# with the latest/ tree of the marine-wind-live branch as its data/, plus the
# model scorecard from the marine-wind-scorecard branch), the verification page
# (marine_wind/verification_page/, served at /verification/ with the data/ tree
# of the verification-data branch), the research scores page
# (marine_wind/scores_page/, served at /research-scores/ with the four files of the
# `scores` release of jkrek17/marine-research-data fetched into its data/ at publish
# time; the weekly job there writes them Mondays 06:00 UTC), the globe kit the globe pages load
# (globe_kit/, served at /globe-kit/: MapLibre, the shared look and script, the
# land outline), the IBM Plex fonts the projects index uses (fonts/) and
# nothing else; the cyclone phase space pages (the live map, the article and
# the forecasters' guide) have their own site, published by
# cyclone_publish.yml to jkrek17/cyclone, and are not on this one. It is pushed as the
# single commit of the public repository's main branch with the token in the
# secret WEB_TOKEN (a fine-grained personal access token scoped to the public
# repository with Contents: read and write). The public repository serves it
# with GitHub Pages from main at the root.
#
# The HF extratropical low archive (/hf-lows/) is no longer published from
# here: jkrek17/hf-low publishes it, so hf-lows is not in OWN_FOLDERS and is
# copied forward like any other project's folder.
#
# Other projects may publish their own folders to the public repository
# (for example phillies/ from jkrek17/codex, lsr/ from jkrek17/lsrMap and
# wind/ from jkrek17/wind-particles). Because the push replaces the whole
# branch, every top-level folder this site does not own (OWN_FOLDERS) is
# copied forward from the current public main before each push, so a new
# project needs no change here. The root index.html is the projects index,
# built by tools/build_site_index.py from each folder's title and description.
#
# Runs after every live data export and daily collection, on a push that
# changes the page, and by hand. Skips quietly when the variable or the
# secret is not set, so the repository works before the public one exists.

name: Publish public site

on:
  workflow_run:
    workflows: ["Marine wind data", "Marine wind scorecard", "Verification page data"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'cyclone_phase_space/article/live/fonts/**'
      - 'marine_wind/page/**'
      - 'marine_wind/verification_page/**'
      - 'marine_wind/high_seas_page/**'
      - 'marine_wind/scores_page/**'
      - 'globe_kit/**'
      - '.github/workflows/site_publish.yml'
      - 'tools/build_site_index.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check configuration
        id: cfg
        env:
          REPO: ${{ vars.PUBLIC_SITE_REPO }}
          TOKEN: ${{ secrets.WEB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          if [ -z "$REPO" ] || [ -z "$TOKEN" ]; then
            echo "PUBLIC_SITE_REPO or WEB_TOKEN not set; nothing to publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Marine wind data checks hourly and most runs publish nothing: skip
          # those (marine-wind-live's commit is older than the run).
          if [ "$WF_NAME" = "Marine wind data" ]; then
            pushed=$(gh api "repos/$GITHUB_REPOSITORY/commits/marine-wind-live" --jq .commit.committer.date || true)
            if [ -n "$pushed" ] && [ "$(date -d "$pushed" +%s)" -lt "$(date -d "$WF_STARTED" +%s)" ]; then
              echo "Marine wind data published nothing new (marine-wind-live $pushed, run started $WF_STARTED)."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: main

      - name: Fetch the live data branch
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git fetch --depth 1 origin marine-wind-live || echo "no marine-wind-live branch yet"
          rm -rf "$RUNNER_TEMP/marine"
          mkdir -p "$RUNNER_TEMP/marine"
          if git rev-parse --verify -q origin/marine-wind-live >/dev/null; then
            git --work-tree="$RUNNER_TEMP/marine" checkout origin/marine-wind-live -- . 2>/dev/null || true
            git reset -q
          fi
          git fetch --depth 1 origin marine-wind-scorecard || echo "no marine-wind-scorecard branch yet"
          if git rev-parse --verify -q origin/marine-wind-scorecard >/dev/null; then
            git show origin/marine-wind-scorecard:scores.json > "$RUNNER_TEMP/scorecard.json" || rm -f "$RUNNER_TEMP/scorecard.json"
          fi
          git fetch --depth 1 origin verification-data || echo "no verification-data branch yet"
          rm -rf "$RUNNER_TEMP/verif"
          mkdir -p "$RUNNER_TEMP/verif"
          if git rev-parse --verify -q origin/verification-data >/dev/null; then
            git --work-tree="$RUNNER_TEMP/verif" checkout origin/verification-data -- data 2>/dev/null || true
            git reset -q
          fi

      - name: Assemble the site
        if: steps.cfg.outputs.ready == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          rm -rf "$site"
          # The globe kit the globe pages share, at /globe-kit/ (they load it
          # as ../globe-kit/).
          mkdir -p "$site/globe-kit"
          cp -r globe_kit/. "$site/globe-kit/"
          # The IBM Plex fonts the projects index (the site root, built after
          # the kept folders) uses, at /fonts/.
          mkdir -p "$site/fonts"
          cp -r cyclone_phase_space/article/live/fonts/. "$site/fonts/"
          # The marine wind page with the newest run beside it, at /marine-wind/.
          mkdir -p "$site/marine-wind/data"
          cp -r marine_wind/page/. "$site/marine-wind/"
          rm -f "$site/marine-wind/.gitignore"
          if [ -d "$RUNNER_TEMP/marine/latest" ]; then
            cp -r "$RUNNER_TEMP/marine/latest/." "$site/marine-wind/data/"
          fi
          # The model scorecard (marine-wind-scorecard branch), both basins in one file.
          if [ -f "$RUNNER_TEMP/scorecard.json" ]; then
            cp "$RUNNER_TEMP/scorecard.json" "$site/marine-wind/data/scorecard.json"
          fi
          # The verification page with its scores (verification-data branch), at /verification/.
          mkdir -p "$site/verification"
          cp -r marine_wind/verification_page/. "$site/verification/"
          rm -rf "$site/verification/data"
          mkdir -p "$site/verification/data"
          if [ -d "$RUNNER_TEMP/verif/data" ]; then
            cp -r "$RUNNER_TEMP/verif/data/." "$site/verification/data/"
          fi
          # The high seas text draft page, at /high-seas/; its data is the
          # marine wind page's data/hsf/ (published just above).
          mkdir -p "$site/high-seas"
          cp -r marine_wind/high_seas_page/. "$site/high-seas/"
          # The research scores page, at /research-scores/. Its data is the four files of the
          # public `scores` release of jkrek17/marine-research-data (no token). The release
          # sends no CORS headers, so the browser cannot fetch them: they are copied here.
          # A failed download leaves the file out (the page says so) and does not stop the
          # publish. About 30 kB in all.
          mkdir -p "$site/research-scores/data"
          cp -r marine_wind/scores_page/. "$site/research-scores/"
          rm -rf "$site/research-scores/data"
          mkdir -p "$site/research-scores/data"
          for f in standing_scores.csv drift_flags.csv preset_status.csv scores_meta.json; do
            if ! curl -fsSL --retry 4 --retry-all-errors --max-time 60 \
                -o "$site/research-scores/data/$f" \
                "https://github.com/jkrek17/marine-research-data/releases/download/scores/$f"; then
              echo "::warning::could not fetch $f from the scores release"
              rm -f "$site/research-scores/data/$f"
            fi
          done
          ls -l "$site/research-scores/data"
          # Stamp the page's own script and style links with the commit so a
          # browser holding a cached index.html never pairs it with stale
          # files (Pages serves everything with a 10 minute max-age).
          v="${GITHUB_SHA::8}"
          # The kit's files too (../globe-kit/...); the delimiter is # since
          # the paths have slashes.
          kit='\.\./globe-kit/(globe-kit\.js|globe-kit\.css|lib/maplibre-gl\.js|lib/maplibre-gl\.css)'
          sed -i -E "s#(href|src)=\"(style\.css|app\.js|scorecard\.js|$kit)\"#\1=\"\2?v=$v\"#g" "$site/marine-wind/index.html"
          sed -i -E "s#(href|src)=\"(style\.css|app\.js)\"#\1=\"\2?v=$v\"#g" "$site/verification/index.html"
          sed -i -E "s#(href|src)=\"(app\.js|$kit)\"#\1=\"\2?v=$v\"#g" "$site/high-seas/index.html"
          sed -i -E "s#(href|src)=\"(style\.css|app\.js)\"#\1=\"\2?v=$v\"#g" "$site/research-scores/index.html"
          touch "$site/.nojekyll"
          du -sh "$site"

      - name: Keep other projects' folders
        if: steps.cfg.outputs.ready == 'true'
        env:
          REPO: ${{ vars.PUBLIC_SITE_REPO }}
          TOKEN: ${{ secrets.WEB_TOKEN }}
          # Folders this workflow writes (marine-wind, verification, high-seas,
          # research-scores, globe-kit, fonts), plus the ones it used to write
          # and no longer does (cyclone, article and forecasters, now on
          # their own site; data/ and basemap/, from when the map was the
          # root page), which are therefore not carried forward and drop off
          # the site.
          OWN_FOLDERS: cyclone article forecasters marine-wind verification high-seas research-scores globe-kit data fonts basemap
        run: |
          current="$RUNNER_TEMP/current"
          rm -rf "$current"
          # Sparse and blobless, so only the other projects' folders are
          # downloaded, not the storm frames.
          if ! git clone -q --depth 1 --filter=blob:none --sparse \
              "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$current" \
              || ! git -C "$current" sparse-checkout set --no-cone '/*/' $(printf '!/%s/ ' $OWN_FOLDERS); then
            echo "Could not read the current public site; publishing without kept folders."
            exit 0
          fi
          for dir in "$current"/*/; do
            [ -d "$dir" ] || continue
            folder=$(basename "$dir")
            case " $OWN_FOLDERS " in *" $folder "*) continue ;; esac
            if [ ! -e "$RUNNER_TEMP/site/$folder" ]; then
              cp -r "$current/$folder" "$RUNNER_TEMP/site/$folder"
              echo "Kept $folder/"
            fi
          done

      - name: Build the projects index
        if: steps.cfg.outputs.ready == 'true'
        run: python3 tools/build_site_index.py "$RUNNER_TEMP/site"

      - name: Push to the public repository
        if: steps.cfg.outputs.ready == 'true'
        env:
          REPO: ${{ vars.PUBLIC_SITE_REPO }}
          TOKEN: ${{ secrets.WEB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q
          git checkout -q --orphan main
          git config user.name "site-publish"
          git config user.email "site-publish@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git push --force origin main
