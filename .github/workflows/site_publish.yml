# Publishes the public web site to the separate public repository (the
# repository variable PUBLIC_SITE_REPO, for example jkrek17/web) so that this
# repository can be private. The site is assembled from the live map page
# (cyclone_phase_space/article/live/, served at /cyclone/ with its data under
# /cyclone/data/), the forecasters' explainer
# (cyclone_phase_space/article/forecasters/), the article with its figures
# (cyclone_phase_space/article/{index.html,style.css,figures/}), the HF
# extratropical low archive (docs/, with its data rebuilt from data/hf_lows/
# as in pages.yml, served at /hf-lows/), the newest
# live data (the latest/ and storms/ trees of the cps-live branch) and nothing else; it is pushed as the
# single commit of the public repository's main branch with the token in the
# secret WEB_TOKEN (a fine-grained personal access token scoped to the public
# repository with Contents: read and write). The public repository serves it
# with GitHub Pages from main at the root.
#
# Other projects may publish their own folders to the public repository
# (for example phillies/ from jkrek17/codex, lsr/ from jkrek17/lsrMap and
# wind/ from jkrek17/wind-particles). Because the push replaces the whole
# branch, every top-level folder this site does not own (OWN_FOLDERS) is
# copied forward from the current public main before each push, so a new
# project needs no change here. The root index.html is the projects index,
# built by tools/build_site_index.py from each folder's title and description.
#
# Runs after every live data export and daily collection, on a push that
# changes the page, and by hand. Skips quietly when the variable or the
# secret is not set, so the repository works before the public one exists.

name: Publish public site

on:
  workflow_run:
    workflows: ["CPS live map data", "CPS daily collection"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'cyclone_phase_space/article/live/**'
      - 'cyclone_phase_space/article/forecasters/**'
      - 'cyclone_phase_space/article/index.html'
      - 'cyclone_phase_space/article/style.css'
      - 'cyclone_phase_space/article/figures/**'
      - '.github/workflows/site_publish.yml'
      - 'tools/build_site_index.py'
      - 'docs/**'
      - 'data/hf_lows/**'
      - 'tools/build_hf_lows.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check configuration
        id: cfg
        env:
          REPO: ${{ vars.PUBLIC_SITE_REPO }}
          TOKEN: ${{ secrets.WEB_TOKEN }}
        run: |
          if [ -z "$REPO" ] || [ -z "$TOKEN" ]; then
            echo "PUBLIC_SITE_REPO or WEB_TOKEN not set; nothing to publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: main

      - name: Fetch the live data branch
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git fetch --depth 1 origin cps-live || echo "no cps-live branch yet"
          rm -rf "$RUNNER_TEMP/live"
          mkdir -p "$RUNNER_TEMP/live"
          if git rev-parse --verify -q origin/cps-live >/dev/null; then
            git --work-tree="$RUNNER_TEMP/live" checkout origin/cps-live -- . 2>/dev/null || true
            git reset -q
          fi

      - name: Assemble the site
        if: steps.cfg.outputs.ready == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          rm -rf "$site"
          # The live map with its data beside it, served at /cyclone/; the
          # site root is the projects index (built after the kept folders).
          mkdir -p "$site/cyclone/data" "$site/hf-lows"
          cp -r cyclone_phase_space/article/live/. "$site/cyclone/"
          # The plain-language explainer for forecasters, self-contained
          # (its own stylesheet and figure copies), served at /forecasters/.
          mkdir -p "$site/forecasters"
          cp -r cyclone_phase_space/article/forecasters/. "$site/forecasters/"
          # The article with its figures (the interactive 3-D phase space is
          # figures/phase_space_3d.html), served at /article/.
          mkdir -p "$site/article/figures"
          cp cyclone_phase_space/article/index.html cyclone_phase_space/article/style.css "$site/article/"
          cp -r cyclone_phase_space/article/figures/. "$site/article/figures/"
          # The HF extratropical low archive, served at /hf-lows/. Its data
          # is rebuilt from the CSVs first, as the Pages deploy does, so the
          # copy never lags data/hf_lows/.
          python3 tools/build_hf_lows.py
          cp -r docs/. "$site/hf-lows/"
          rm -f "$site/hf-lows/README.md"
          if [ -d "$RUNNER_TEMP/live/latest" ]; then
            cp -r "$RUNNER_TEMP/live/latest" "$site/cyclone/data/latest"
          fi
          if [ -d "$RUNNER_TEMP/live/storms" ]; then
            cp -r "$RUNNER_TEMP/live/storms" "$site/cyclone/data/storms"
          fi
          # Stamp the page's own script and style links with the commit so a
          # browser holding a cached index.html never pairs it with stale
          # files (Pages serves everything with a 10 minute max-age).
          v="${GITHUB_SHA::8}"
          sed -i -E "s/(href|src)=\"(style\.css|basemap\.js|card\.js|storms\.js|space3d\.js|app\.js)\"/\1=\"\2?v=$v\"/g" "$site/cyclone/index.html"
          grep -c "?v=$v" "$site/cyclone/index.html"
          touch "$site/.nojekyll"
          du -sh "$site"

      - name: Keep other projects' folders
        if: steps.cfg.outputs.ready == 'true'
        env:
          REPO: ${{ vars.PUBLIC_SITE_REPO }}
          TOKEN: ${{ secrets.WEB_TOKEN }}
          # Folders this workflow writes (cyclone, article, forecasters,
          # hf-lows), plus data/, fonts/ and basemap/,
          # which the map used at the root before it moved to /cyclone/.
          OWN_FOLDERS: cyclone article forecasters hf-lows data fonts basemap
        run: |
          current="$RUNNER_TEMP/current"
          rm -rf "$current"
          # Sparse and blobless, so only the other projects' folders are
          # downloaded, not the storm frames.
          if ! git clone -q --depth 1 --filter=blob:none --sparse \
              "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$current" \
              || ! git -C "$current" sparse-checkout set --no-cone '/*/' $(printf '!/%s/ ' $OWN_FOLDERS); then
            echo "Could not read the current public site; publishing without kept folders."
            exit 0
          fi
          for dir in "$current"/*/; do
            [ -d "$dir" ] || continue
            folder=$(basename "$dir")
            case " $OWN_FOLDERS " in *" $folder "*) continue ;; esac
            if [ ! -e "$RUNNER_TEMP/site/$folder" ]; then
              cp -r "$current/$folder" "$RUNNER_TEMP/site/$folder"
              echo "Kept $folder/"
            fi
          done

      - name: Build the projects index
        if: steps.cfg.outputs.ready == 'true'
        run: python3 tools/build_site_index.py "$RUNNER_TEMP/site"

      - name: Push to the public repository
        if: steps.cfg.outputs.ready == 'true'
        env:
          REPO: ${{ vars.PUBLIC_SITE_REPO }}
          TOKEN: ${{ secrets.WEB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q
          git checkout -q --orphan main
          git config user.name "site-publish"
          git config user.email "site-publish@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git push --force origin main
