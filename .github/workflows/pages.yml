# Publishes the HF extratropical low archive to GitHub Pages.
#
# configure-pages runs with enablement: true, so the first successful run turns
# Pages on by itself. If your account or organization blocks Pages, that call
# fails and you have to enable it by hand: Settings > Pages > Build and
# deployment > Source = "GitHub Actions".
#
# The site data is regenerated from the CSVs in data/hf_lows/ on every run, so
# the published page can never drift from the committed source data - even if
# someone forgets to re-run the build script before committing.

name: Deploy archive site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/hf_lows/**'
      - 'tools/build_hf_lows.py'
      - '.github/workflows/pages.yml'
  # Lets you publish a preview from a feature branch: Actions > this workflow >
  # Run workflow > pick the branch.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild site data from the CSV archive
        run: python3 tools/build_hf_lows.py

      # Every build stamps a fresh "generated" time and a "build" provenance
      # object (git commit/dirty flag, host) that is specific to *this* build,
      # not to the data - so a plain git diff always reports a change even
      # when nothing about the archive itself moved. Compare the payload with
      # those two fields removed, which is the only comparison that says
      # anything about the data.
      - name: Warn if the committed data is stale
        run: |
          python3 - <<'PY'
          import json, subprocess
          fresh = json.load(open('docs/data/hf-lows.json'))
          committed = json.loads(
              subprocess.check_output(['git', 'show', 'HEAD:docs/data/hf-lows.json']))
          for payload in (fresh, committed):
              payload.pop('generated', None)
              payload.pop('build', None)
          if fresh != committed:
              print('::warning::docs/data is out of date with data/hf_lows/. The '
                    'published site uses the freshly built version; re-run '
                    'tools/build_hf_lows.py and commit to keep them in step.')
          else:
              print('docs/data matches a fresh build of data/hf_lows/.')
          PY

      # The forecaster's downstream repo (ocean-weather-gov) runs this exact
      # check - `npm install -g html-validate` then `html-validate` with no
      # config file, i.e. the tool's defaults - over their copy of docs/
      # (which they keep at www/htdocs). Run it here too, before the artifact
      # is uploaded, so a page that would fail their CI fails ours first,
      # where it's cheap, instead of blocking a merge request over there.
      #
      # Version: pinned rather than "latest" like they run. Their pipeline
      # always installs whatever is newest, so pinning here means we can
      # in theory diverge from them - a rule they'd catch and we wouldn't,
      # or vice versa. But an unpinned `npm install -g html-validate` here
      # means html-validate can ship a new/stricter default rule at any
      # time and turn our build red with no change on our side, on a push
      # we don't control the timing of. Pinning trades a little drift for
      # reproducible, deliberate upgrades: bump the version below in its
      # own commit when we choose to, and see the diff in review. Bump
      # periodically to keep drift from their "latest" small.
      - name: Validate published HTML (html-validate)
        run: |
          npm install -g html-validate@11.15.0
          html-validate docs

      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on the first run instead of requiring
          # someone to flip the repository setting first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
