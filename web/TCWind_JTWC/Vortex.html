<!--
  Vortex.html - shared client-side vortex + parser code for the TCWind_JTWC
  web app.  This file is a single script block and nothing else.  Pages
  include it with

      <?!= HtmlService.createHtmlOutputFromFile('Vortex').getContent(); ?>

  (<?!= rather than <?= because this is our own trusted markup, not user
  data.)

  It is the SINGLE JavaScript source of truth for the wind-field math.
  Index.html, Archive.html and Findings.html must not carry their own
  copies of anything defined here.  A third, divergent copy of
  resolveRmax() living in Findings.html - with `<=` where the tool has `<`
  - was a real shipped bug; do not reintroduce it in any form.

  Ported line-for-line from GFE/procedures/TCWind_JTWC.py.  That file is the
  reference implementation.  If the two disagree, the Python is right and
  this file is wrong.  tests/tcwind_jtwc/compare_py_js.py drives both sides
  on identical inputs and must stay green (0.5 kt magnitude, 1 nm radius,
  1 deg direction).

  Style: ES5, `var`/`function` only, no build step, no dependencies.  The
  Apps Script HTML-service iframe is modern, but Vortex.html is also loaded
  raw by the Node parity harness, and ES5 keeps both trivial.
-->
<script>
// ===========================================================================
// Tunables.  These MUST match the constants block in TCWind_JTWC.py.
// ===========================================================================

// --- GTCM/WTCM, all from the Gridded TCM Users Guide v1.9.1 ---------------
var GTCM_ASYM_A            = 1.6;    // eq. (2): a = A * c**B, c in kt
var GTCM_ASYM_B            = 0.63;
var GTCM_QUAD_AVG_FACTOR   = 0.85;   // quadrant max -> quadrant average
var GTCM_W_34              = 5.0;    // eq. (7) weights
var GTCM_W_INNER           = 1.0;
var GTCM_ASYM_MAX_DEV_KT   = 10.0;   // how far ax/ay may leave the motion vector
var GTCM_APPLY_INFLOW      = false;  // the guide has no inflow term
// Admissible range for the size exponents.  eq. (6)'s own climatological
// value spans about 0.37 to 0.95 across realistic Vmax/latitude, so this
// brackets what the guide considers physical.  The former 0.05 floor admitted
// a field that barely decays with radius.  MUST match TCWind_JTWC.py.
var GTCM_X_MIN             = 0.20;
var GTCM_X_MAX             = 1.20;
var GTCM_MAX_ITER          = 220;
var GTCM_ASYM_STEPS        = 9;

// Probe grid used to recover the modelled 34 kt radius per azimuth.  This
// mirrors `probe = np.linspace(1.0, 900.0, 900)` in _buildVortexGTCM(),
// which is exactly the integers 1..900 nm.
var GTCM_R34_PROBE_MAX_NM  = 900;

// --- EXPERIMENTAL, default-off.  Not in the Users Guide, not in the Python --
//
// Two candidate extratropical-transition terms, reachable ONLY by passing an
// `opts` object to fitGTCM()/vortexFieldGTCM().  With `opts` omitted every
// code path below is bypassed and the field is bit-for-bit what it was
// before these were added - which is what keeps compare_py_js.py green while
// GFE/procedures/TCWind_JTWC.py has no counterpart for them.
//
// Deliberate asymmetry of state: the Python is the reference implementation,
// so anything DEFAULT-ON must exist there first.  These are default-off
// precisely so they can be measured on ?page=lab before that cost is paid.
// If one of them wins, it gets ported and the default flips - in the same
// change, or parity breaks.
var GTCM_WN2_E_MAX         = 0.45;   // ellipticity ceiling; 0.5 folds the axis
var GTCM_ET_KAPPA_MAX      = 4.0;    // rm growth ceiling for the ET prior
var GTCM_ET_BETA_MAX       = 0.50;   // x reduction ceiling for the ET prior

// --- shared with the retired per-quadrant construction --------------------
var MOTION_ASYMMETRY_FRACTION = 0.5;
var INFLOW_ANGLE_DEG          = 22.0;
var RMAX_OVERRIDE_NM          = 0.0;
var OUTER_DECAY_FACTOR        = 1.0;
var MIN_OUTER_DECAY_NM        = 30.0;
var NORMALIZE_CORE_PEAK       = true;
var PEAK_NORMALIZE_MAX_FACTOR = 2.0;
var MAX_INSERT_RADIUS_FACTOR  = 5.0;

var KT2MS = 0.514444;
var KM2NM = 1 / 1.852;
var EARTH_R_NM = 3440.065;

var QUADS = ['NE', 'SE', 'SW', 'NW'];
var QUAD_AZ = { NE: 45, SE: 135, SW: 225, NW: 315 };
// Compass quadrant BOUNDARIES (not centres), for drawing the literal
// reported-radii polygon.  Everything else keys off QUAD_AZ.
var QUAD_BOUNDS = { NE: [0, 90], SE: [90, 180], SW: [180, 270], NW: [270, 360] };

var QUAD_WORD = {
  NORTHEAST: 'NE', SOUTHEAST: 'SE', SOUTHWEST: 'SW', NORTHWEST: 'NW'
};
var MONTHS = {
  JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6,
  JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12
};

var CONF_TROPICAL    = 1.00;
var CONF_BECOMING    = 0.60;
var CONF_SUBTROPICAL = 0.25;

var DEG2RAD = Math.PI / 180;
var RAD2DEG = 180 / Math.PI;


// ===========================================================================
// Small helpers where Python and JavaScript genuinely differ
// ===========================================================================

/** Python `d.get(k, dflt)`.  Plain `obj[k]` walks the prototype chain, so a
 *  key like "constructor" or "toString" comes back as a truthy *function*
 *  instead of the default, and that value then propagates silently into
 *  NaN.  Every dictionary lookup driven by parsed bulletin text goes
 *  through here. */
function dictGet(obj, key, dflt) {
  if (obj && Object.prototype.hasOwnProperty.call(obj, key)) return obj[key];
  return dflt;
}

/** Python `k in d`. */
function dictHas(obj, key) {
  return !!obj && Object.prototype.hasOwnProperty.call(obj, key);
}

/** Python `not d` for a dict: true only when it has no keys. */
function dictEmpty(obj) {
  if (!obj) return true;
  for (var k in obj) {
    if (Object.prototype.hasOwnProperty.call(obj, k)) return false;
  }
  return true;
}

/** Python `x % 360` for floats: always in [0, 360).  JavaScript's `%` keeps
 *  the sign of the dividend, so a bare `x % 360` is negative for negative x
 *  and every bearing west of north comes out wrong. */
function mod360(x) {
  var m = x % 360;
  return m < 0 ? m + 360 : m;
}

function clamp(x, lo, hi) {
  return x < lo ? lo : (x > hi ? hi : x);
}

/** numpy's pairwise summation, so `npSum` rounds the way `np.sum` does.
 *  numpy sums 8 running accumulators and combines them as a binary tree;
 *  a naive left-to-right loop rounds differently in the last bit or two,
 *  and the GTCM fit is an iterative optimiser whose branch decisions are
 *  exact float comparisons.  Only the n < 8 and n <= 128 branches are
 *  reproduced: the GTCM error function sums at most 12 terms (3 thresholds
 *  x 4 quadrants). */
function npSum(a) {
  var n = a.length, i, res;
  if (n === 0) return 0.0;
  if (n < 8) {
    res = 0.0;
    for (i = 0; i < n; i++) res += a[i];
    return res;
  }
  var r0 = a[0], r1 = a[1], r2 = a[2], r3 = a[3];
  var r4 = a[4], r5 = a[5], r6 = a[6], r7 = a[7];
  var lim = n - (n % 8);
  for (i = 8; i < lim; i += 8) {
    r0 += a[i];     r1 += a[i + 1]; r2 += a[i + 2]; r3 += a[i + 3];
    r4 += a[i + 4]; r5 += a[i + 5]; r6 += a[i + 6]; r7 += a[i + 7];
  }
  res = ((r0 + r1) + (r2 + r3)) + ((r4 + r5) + (r6 + r7));
  for (; i < n; i++) res += a[i];
  return res;
}

/** numpy's `np.median` for a small 1-D array: sort, then the middle value,
 *  or the mean of the two middle values for an even count. */
function npMedian(a) {
  var s = a.slice().sort(function (x, y) { return x - y; });
  var n = s.length;
  if (n === 0) return NaN;
  var h = n >> 1;
  return (n % 2) ? s[h] : (s[h - 1] + s[h]) / 2.0;
}

/** numpy's `np.linspace(start, stop, num)`, endpoint included. */
function npLinspace(start, stop, num) {
  var out = new Array(num);
  if (num === 1) { out[0] = start; return out; }
  var step = (stop - start) / (num - 1);
  for (var i = 0; i < num; i++) out[i] = start + i * step;
  out[num - 1] = stop;       // numpy pins the endpoint exactly
  return out;
}


// ===========================================================================
// Geometry
// ===========================================================================

/** Great-circle distance (nm) and bearing (deg true) from a centre.
 *  Port of _distBearingGrids(); returns [distNm, bearingDeg]. */
function distBearing(lat, lon, clat, clon) {
  var lat1 = clat * DEG2RAD;
  var lon1 = clon * DEG2RAD;
  var lat2 = lat * DEG2RAD;
  // Python: np.radians(((lonGrid + 180.0) % 360.0) - 180.0).  Python's %
  // is always non-negative; JavaScript's is not, hence mod360().
  var lon2 = (mod360(lon + 180.0) - 180.0) * DEG2RAD;
  var dlon = lon2 - lon1;

  var sinLat1 = Math.sin(lat1), cosLat1 = Math.cos(lat1);
  var sinLat2 = Math.sin(lat2), cosLat2 = Math.cos(lat2);

  var s1 = Math.sin((lat2 - lat1) / 2.0);
  var s2 = Math.sin(dlon / 2.0);
  var a = s1 * s1 + cosLat1 * cosLat2 * s2 * s2;
  var dist = 2.0 * EARTH_R_NM * Math.asin(Math.sqrt(clamp(a, 0.0, 1.0)));

  var y = Math.sin(dlon) * cosLat2;
  var x = cosLat1 * sinLat2 - sinLat1 * cosLat2 * Math.cos(dlon);
  var brg = mod360(Math.atan2(y, x) * RAD2DEG);
  return [dist, brg];
}

/** Point at a bearing/distance from a centre.  Inverse of distBearing();
 *  used for drawing and for generating parity sample points. */
function destPoint(clat, clon, brgDeg, distNm) {
  var d = distNm / EARTH_R_NM, b = brgDeg * DEG2RAD;
  var l1 = clat * DEG2RAD, o1 = clon * DEG2RAD;
  var l2 = Math.asin(Math.sin(l1) * Math.cos(d) +
                     Math.cos(l1) * Math.sin(d) * Math.cos(b));
  var o2 = o1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(l1),
                           Math.cos(d) - Math.sin(l1) * Math.sin(l2));
  return [l2 * RAD2DEG, (((o2 * RAD2DEG) + 540) % 360) - 180];
}


// ===========================================================================
// Rmax
// ===========================================================================

/** Willoughby-form Rmax regression, in nm.  Same functional form as
 *  Willoughby et al. (2006) but refit against 13,834 JTWC WestPac
 *  best-track records (2005-2024, IBTrACS agency jtwc_wp).  MUST match
 *  willoughbyRmax() in TCWind_JTWC.py. */
function willoughbyRmax(vmaxKt, latDeg) {
  var vms = vmaxKt * KT2MS;
  return 98.392 * Math.exp(-0.025088 * vms + 0.003021 * Math.abs(latDeg)) * KM2NM;
}

/** Rmax estimate, clamped so it stays inside the highest reported ring.
 *
 *  THE ONLY COPY OF THIS FUNCTION IN THE CLIENT CODE.  Note `vmax < thr`,
 *  strictly less than: a storm whose peak exactly equals a threshold (a
 *  50 kt storm reporting R50 - common, JTWC rounds Vmax to 5 kt bins) does
 *  reach that threshold, so its ring is real information and must clamp
 *  Rmax.  Only a *stale* ring, already below the storm's current
 *  intensity, is skipped.  A `<=` here silently widens Rmax on exactly the
 *  storms where the reported ring matters most. */
function resolveRmax(snap, overrideNm) {
  var rmax = (overrideNm && overrideNm > 0)
    ? Number(overrideNm)
    : willoughbyRmax(snap.vmax, snap.lat);

  var radii = snap.radii || {};
  var thrs = [64, 50, 34];
  for (var i = 0; i < thrs.length; i++) {
    var thr = thrs[i];
    if (!dictHas(radii, thr)) continue;
    if (snap.vmax < thr) continue;
    var quad = radii[thr];
    var nz = [];
    for (var k in quad) {
      if (!Object.prototype.hasOwnProperty.call(quad, k)) continue;
      var v = Number(quad[k]);
      if (v > 0.0) nz.push(v);
    }
    if (nz.length) {
      rmax = Math.min(rmax, 0.7 * Math.min.apply(null, nz));
    }
    break;
  }
  return Math.max(rmax, 3.0);
}


// ===========================================================================
// GTCM / WTCM vortex - Gridded TCM Users Guide v1.9.1 (Santos & DeMaria)
// ===========================================================================

/** Climatological RMW in nm.  Users Guide eq. (5). */
function gtcmClimoRmax(vmax, lat) {
  return Math.exp(3.7450 - 0.01338 * Number(vmax) + 0.01908 * Math.abs(Number(lat)));
}

/** Climatological size parameter, non-dimensional.  Users Guide eq. (6). */
function gtcmClimoX(vmax, lat) {
  return 0.1989 + 0.00475 * Number(vmax) + 0.00142 * Math.abs(Number(lat));
}

/** Schwerdt (1979) asymmetry magnitude in kt.  Users Guide eq. (2). */
function gtcmAsymmetry(motionSpd) {
  if (!motionSpd || motionSpd <= 0) return 0.0;
  return GTCM_ASYM_A * Math.pow(Number(motionSpd), GTCM_ASYM_B);
}

/** Wavenumber-2 radius scale for the elongation experiment.
 *
 *      s(az) = 1 + e cos(2 (az - phi))
 *
 *  A pure multiplier on radius, so - per the note on gtcmProfile() - it is
 *  exactly equivalent to letting rm and ri vary with azimuth.  phi is the
 *  bearing of the LONG axis: s peaks at az = phi and at phi + 180, which is
 *  what makes it wavenumber 2 rather than the wavenumber 1 that eqs. (8)/(9)
 *  already supply.
 *
 *  Why this term at all: the most recognisable thing about a transitioning
 *  cyclone is that its wind field elongates along the baroclinic zone.
 *  eq. (3) is radially symmetric and eqs. (8)/(9) add a single wavenumber-1
 *  displacement, so the shipped model cannot make an elongated field at any
 *  parameter setting.  This is the smallest term that can.
 *
 *  e is SIGNED.  Negative e is the same shape with the long axis rotated 90
 *  degrees, and it is admitted deliberately: phi defaults to the motion
 *  vector, so bounding e at zero would let a fit elongate only ALONG the
 *  track and never across it, and "does an ET field stretch along its motion
 *  or across it" is one of the questions worth asking rather than assuming.
 *
 *  |e| is clamped: at |e| = 1 the short axis collapses to zero radius and
 *  beyond that the scale goes negative and the axis folds through the
 *  centre. */
function gtcmWn2Scale(azDeg, e, phiDeg) {
  if (!e) return 1.0;
  var ee = clamp(Number(e), -GTCM_WN2_E_MAX, GTCM_WN2_E_MAX);
  return 1.0 + ee * Math.cos(2.0 * (Number(azDeg) - Number(phiDeg)) * DEG2RAD);
}

/** Transition fraction eps in [0, 1] from IBTrACS' NATURE flag.
 *
 *  eps = 1 - conf, so it lines up with the confidence the JTWC parser already
 *  assigns from the bulletin text: CONF_TROPICAL -> 0, CONF_BECOMING -> 0.40,
 *  CONF_SUBTROPICAL -> 0.75.  That is the whole point of expressing it this
 *  way - the lab scores against best track using NATURE, but anything that
 *  wins has to run off the bulletin's own wording, and this keeps the two
 *  scales identical.
 *
 *  The mapping is a PROXY and should be read as one:
 *    TS, DS  tropical / disturbance   -> tropical
 *    MX      "mixture", i.e. the reporting agencies disagree about the type,
 *            which is not the same thing as "becoming extratropical" but is
 *            the closest flag IBTrACS has to mid-transition
 *    SS      subtropical              -> same level the parser gives it
 *    ET      extratropical            -> same level the parser gives it
 *  Anything unrecognised is treated as tropical, so an unknown flag cannot
 *  silently apply a transition adjustment. */
function etFractionFromNature(nature) {
  switch (String(nature || '').toUpperCase()) {
    case 'ET': return 1.0 - CONF_SUBTROPICAL;
    case 'SS': return 1.0 - CONF_SUBTROPICAL;
    case 'MX': return 1.0 - CONF_BECOMING;
    default:   return 0.0;
  }
}

/** The extratropical prior: what eps does to eqs. (5) and (6).
 *
 *      rm -> rm (1 + (kappa - 1) eps)          eq. (5) scaled
 *      x  -> x  - beta eps                     eq. (6) shifted
 *
 *  Returned as multipliers on the CLIMATOLOGY rather than on the fitted
 *  parameters, and that distinction is the entire design.  The reported radii
 *  are data; transition is a prior.  Scaling the fit output would override
 *  what the bulletin said, which is the one thing this tool promises not to
 *  do.  Shifting the climatology moves the first guess and the bounds and
 *  lets weighted least squares still answer to the radii.
 *
 *  It also lands where the leverage actually is.  As a system transitions its
 *  R64 goes to zero, then its R50, so gtcmTargets() returns fewer points and
 *  fitGTCM()'s freeParams ladder drops to 2 and then 1 - at which point x IS
 *  the climatological value and rm is bounded to 0.5-2.0 times it.  During
 *  transition the prior is not a starting point, it is most of the answer.
 *
 *  Sign note on eq. (6): its own latitude term is +0.00142/deg, i.e. x rises
 *  poleward, i.e. a TIGHTER field at high latitude.  That is a regression on
 *  tropical systems and it points the wrong way for transition, which is why
 *  beta subtracts rather than relying on latitude to do the work. */
function gtcmEtPrior(eps, kappa, beta) {
  var e0 = clamp(Number(eps) || 0.0, 0.0, 1.0);
  var k = clamp(kappa === undefined ? 1.0 : Number(kappa), 1.0, GTCM_ET_KAPPA_MAX);
  var b = clamp(beta === undefined ? 0.0 : Number(beta), 0.0, GTCM_ET_BETA_MAX);
  return { eps: e0, rmScale: 1.0 + (k - 1.0) * e0, xShift: -b * e0 };
}

/** Symmetric modified Rankine tangential wind.  Users Guide eq. (3).
 *
 *      V = (Vm-a)(r/rm)            r  < rm
 *          (Vm-a)(rm/r)**x1        rm <= r < ri
 *          A(Vm-a)(rm/r)**x2       ri <= r    A = (rm/ri)**(x1-x2)
 *
 *  The comparisons are strictly `<` on both sides, matching the nested
 *  np.where() in _gtcmProfile().  At both rm and ri the bracketing branches
 *  agree, so the choice is cosmetic - but the parity suite probes exactly on
 *  both radii anyway, because that is where a sign slip in A would show.
 *
 *  A exists solely to make V continuous across ri.  The Users Guide PRINTS
 *  A = (ri/rm)**x1 (rm/ri)**x2, which is (rm/ri)**(x2-x1) - the reciprocal of
 *  what continuity requires, and only correct in the degenerate x1 == x2
 *  case.  Transcribed literally it left a mean +4.4 kt step at ri (max +44)
 *  and made the GTCM field measurably ROUGHER than the per-quadrant
 *  construction it replaced.  Both ports now carry the corrected form; see
 *  the matching comment in _gtcmProfile() and the radial-value-jump column in
 *  tests/tcwind_jtwc/verify_gtcm.py.
 *
 *  Note for the wavenumber-2 experiment: this function is scale-covariant in
 *  radius.  gtcmProfile(r/s, vmax, a, rm, ri, x1, x2) is IDENTICALLY
 *  gtcmProfile(r, vmax, a, rm*s, ri*s, x1, x2) - A is scale-free and every
 *  branch depends on r only through r/rm or r/ri.  That is why elongating the
 *  vortex needs no new profile code, only a per-azimuth radius scale. */
function gtcmProfile(r, vmax, a, rm, ri, x1, x2) {
  var vs = Math.max(Number(vmax) - Number(a), 0.0);
  rm = Math.max(Number(rm), 1e-3);
  ri = Math.max(Number(ri), rm * 1.0001);
  var safe = Math.max(Number(r), 1e-6);
  if (safe < rm) return vs * (safe / rm);
  if (safe < ri) return vs * Math.pow(rm / safe, x1);
  // A makes V continuous across ri: (rm/ri)^x1 == A*(rm/ri)^x2, so
  // A = (rm/ri)^(x1-x2).  The Users Guide prints a different expression that
  // is only continuous when x1 == x2; see the matching comment in
  // TCWind_JTWC.py's _gtcmProfile().
  var A = Math.pow(rm / ri, x1 - x2);
  return A * vs * Math.pow(rm / safe, x2);
}

/** 2-D wind from tangential wind plus asymmetry.  Users Guide eq. (8)/(9).
 *  Returns [u, v] (eastward, northward), mirroring the Python tuple.
 *
 *  The guide writes u = ax - V sin(theta), v = ay + V cos(theta) with theta
 *  counterclockwise from east.  Azimuth here is a compass bearing from the
 *  centre and theta = 90 - bearing, so sin(theta) -> cos(bearing) and
 *  cos(theta) -> sin(bearing).
 *
 *  The guide is NHC's, so it only describes the northern hemisphere.  JTWC
 *  warns on southern-hemisphere basins, where the tangential flow reverses;
 *  `sign` handles that.  The asymmetry vector is NOT reversed - it still
 *  points with the motion. */
function gtcmUV(V, azDeg, ax, ay, lat) {
  var azr = Number(azDeg) * DEG2RAD;
  var sign = (lat >= 0) ? 1.0 : -1.0;
  return [ax - sign * V * Math.cos(azr),
          ay + sign * V * Math.sin(azr)];
}

/** Fit points: [radiusNm, bearingDeg, thresholdKt, weight].
 *
 *  Reported radii are the MAXIMUM extent in the quadrant; the vortex is fit
 *  to the quadrant AVERAGE, so each radius is scaled by
 *  GTCM_QUAD_AVG_FACTOR first.  Weights follow eq. (7): five on the 34 kt
 *  points, one elsewhere.  A quadrant reporting 000 NM contributes no
 *  target at all - it is not a zero-radius constraint. */
function gtcmTargets(snap) {
  var out = [];
  var radii = snap.radii || {};
  var thrs = [64, 50, 34];
  for (var i = 0; i < thrs.length; i++) {
    var thr = thrs[i];
    var quad = dictGet(radii, thr, null);
    if (dictEmpty(quad) || snap.vmax < thr) continue;
    for (var j = 0; j < QUADS.length; j++) {
      var q = QUADS[j];
      var rep = Number(dictGet(quad, q, 0.0));
      if (rep && rep > 0.0) {
        out.push([rep * GTCM_QUAD_AVG_FACTOR, QUAD_AZ[q], thr,
                  (thr === 34) ? GTCM_W_34 : GTCM_W_INNER]);
      }
    }
  }
  return out;
}

/** Small Nelder-Mead, so the fit needs no external solver.  Port of
 *  _nelderMead().  Returns [bestPoint, bestValue].
 *
 *  The index sort must be STABLE and ascending to match Python's sorted():
 *  ties keep their previous order, and a different tie order sends the
 *  simplex down a different path.  Array.prototype.sort has been required
 *  to be stable since ES2019. */
function nelderMead(fn, guess, step, maxIter) {
  var n = guess.length, i, j;
  var simplex = [guess.slice()];
  for (i = 0; i < n; i++) {
    var pt = guess.slice();
    pt[i] += step[i];
    simplex.push(pt);
  }
  var vals = [];
  for (i = 0; i <= n; i++) vals.push(fn(simplex[i]));

  for (var it = 0; it < maxIter; it++) {
    var order = [];
    for (i = 0; i <= n; i++) order.push(i);
    order.sort(function (p, q) { return vals[p] - vals[q]; });
    var ns = [], nv = [];
    for (i = 0; i <= n; i++) { ns.push(simplex[order[i]]); nv.push(vals[order[i]]); }
    simplex = ns; vals = nv;

    if (Math.abs(vals[n] - vals[0]) <= 1e-9 * (Math.abs(vals[0]) + 1e-9)) break;

    var centroid = [];
    for (i = 0; i < n; i++) {
      var s = 0.0;
      for (j = 0; j < n; j++) s += simplex[j][i];   // simplex[:-1], in order
      centroid.push(s / n);
    }
    var refl = [];
    for (i = 0; i < n; i++) refl.push(centroid[i] + (centroid[i] - simplex[n][i]));
    var fr = fn(refl);

    if (fr < vals[0]) {
      var exp = [];
      for (i = 0; i < n; i++) exp.push(centroid[i] + 2.0 * (centroid[i] - simplex[n][i]));
      var fe = fn(exp);
      if (fe < fr) { simplex[n] = exp;  vals[n] = fe; }
      else         { simplex[n] = refl; vals[n] = fr; }
    } else if (fr < vals[n - 1]) {
      simplex[n] = refl; vals[n] = fr;
    } else {
      var con = [];
      for (i = 0; i < n; i++) con.push(centroid[i] + 0.5 * (simplex[n][i] - centroid[i]));
      var fc = fn(con);
      if (fc < vals[n]) {
        simplex[n] = con; vals[n] = fc;
      } else {
        for (i = 1; i <= n; i++) {
          var shrunk = [];
          for (j = 0; j < n; j++) {
            shrunk.push(simplex[0][j] + 0.5 * (simplex[i][j] - simplex[0][j]));
          }
          simplex[i] = shrunk;
          vals[i] = fn(shrunk);
        }
      }
    }
  }

  var best = 0;
  for (i = 1; i <= n; i++) if (vals[i] < vals[best]) best = i;
  return [simplex[best], vals[best]];
}

/** Fit the GTCM vortex to one storm-time.  Port of fitGTCM().
 *
 *  Returns {rm, ri, x1, x2, ax, ay, a, n, rms}.  Users Guide steps 2b-3:
 *  climatological first guess from (5)/(6); ri at the median reported
 *  radius; (rm, x1, x2) by weighted least squares on WIND error (7); then
 *  ax/ay released within GTCM_ASYM_MAX_DEV_KT with the size parameters
 *  held fixed.
 *
 *  The fit deliberately does NOT pass through the reported radii.  The
 *  guide minimises wind error, not radius error, because forcing the radii
 *  produces unrealistic structure. */
function fitGTCM(snap, opts) {
  var vmax = Number(snap.vmax);
  var lat = Number(snap.lat);
  var a = gtcmAsymmetry(snap.motionSpd);
  var motionDir = (snap.motionDir === null || snap.motionDir === undefined)
    ? 0.0 : Number(snap.motionDir);
  var mr = motionDir * DEG2RAD;
  var ax0 = a * Math.sin(mr);      // eq. (1)
  var ay0 = a * Math.cos(mr);

  // --- EXPERIMENTAL opts.  Absent => every branch below is skipped. --------
  // Guarded with `if (x)` rather than multiplied by an identity so the
  // no-opts path executes the SAME arithmetic it did before these existed,
  // not merely arithmetic that happens to agree.  compare_py_js.py is the
  // check that this is true, and it has no knowledge of opts at all.
  var o = opts || {};
  var wn2 = o.wn2 || {};
  var wn2e = Number(wn2.e) || 0.0;
  // phi is the bearing of the long axis.  Given explicitly it is used as
  // given; omitted, it falls back to the motion vector, because a
  // transitioning cyclone accelerates broadly ALONG the baroclinic zone it
  // is elongating into.  That proxy is free - it needs no field the bulletin
  // does not already carry - which is exactly what makes it worth measuring
  // against a hand-set axis.
  var wn2phi = (wn2.phi === null || wn2.phi === undefined)
    ? motionDir : Number(wn2.phi);
  if (wn2.phiOffset) wn2phi = wn2phi + Number(wn2.phiOffset);
  var fitE = !!o.fitE && wn2e > 0.0;

  var rmc = gtcmClimoRmax(vmax, lat);
  var xc = gtcmClimoX(vmax, lat);
  if (o.rmScale) rmc = rmc * Number(o.rmScale);
  if (o.xShift) xc = clamp(xc + Number(o.xShift), GTCM_X_MIN, GTCM_X_MAX);

  var targets = gtcmTargets(snap);
  if (!targets.length) {
    // No radii anywhere: climatology is all there is.  Guide step 2c.
    return { rm: rmc, ri: rmc * 3.0, x1: xc, x2: xc,
             ax: ax0, ay: ay0, a: a, n: 0, freeParams: 0, rms: NaN,
             e: wn2e, phi: wn2phi, rmc: rmc, xc: xc };
  }

  var nT = targets.length;
  var rr = new Array(nT), az = new Array(nT), vt = new Array(nT), wt = new Array(nT);
  for (var i = 0; i < nT; i++) {
    rr[i] = targets[i][0]; az[i] = targets[i][1];
    vt[i] = targets[i][2]; wt[i] = targets[i][3];
  }
  var ri = npMedian(rr);
  var terms = new Array(nT);

  // e == 0 takes the original expression untouched; only the elongated case
  // pays for the per-target radius rescale.  Evaluating the profile at r/s is
  // identically evaluating it at r with rm and ri stretched by s - see the
  // scale-covariance note on gtcmProfile() - so there is no second profile.
  function err(rm, x1, x2, ax, ay, e, phi) {
    for (var k = 0; k < nT; k++) {
      var rEff = e ? (rr[k] / gtcmWn2Scale(az[k], e, phi)) : rr[k];
      var V = gtcmProfile(rEff, vmax, a, rm, ri, x1, x2);
      var uv = gtcmUV(V, az[k], ax, ay, lat);
      var d = Math.sqrt(uv[0] * uv[0] + uv[1] * uv[1]) - vt[k];
      terms[k] = wt[k] * (d * d);
    }
    return npSum(terms);
  }

  // Only estimate what the reported radii can identify.  rm, x1 and x2 are
  // three free parameters; two nonzero radii constrain two numbers, and
  // fitting all three to two targets leaves a manifold of exact solutions -
  // every one scoring RMS 0 - with the optimiser landing anywhere on it.  On
  // live TS 22W (KROVANH) that produced rm 7.8 nm with x1 = x2 = 0.05: a field
  // that barely decays with radius, drawn as a flat sheet the asymmetry cut
  // into a one-sided wedge.  Mirrors fitGTCM() in TCWind_JTWC.py.
  var nfit = nT;
  var freeParams = nfit >= 5 ? 3 : (nfit >= 3 ? 2 : 1);

  // rm stays near climatology when the radii cannot pin it: the guide treats
  // the climatological value as a first guess "adjusted to better fit" the
  // radii.  Unbounded, a thin fit walks rm outward chasing a threshold the
  // symmetric vortex (peaking at Vm - a) may never reach.
  var rmLo, rmHi;
  if (freeParams === 3) { rmLo = 2.0; rmHi = 150.0; }
  else if (freeParams === 2) { rmLo = 0.4 * rmc; rmHi = 2.5 * rmc; }
  else { rmLo = 0.5 * rmc; rmHi = 2.0 * rmc; }

  var rm, x1, x2, sizeRes;
  var eFit = wn2e;
  if (fitE && freeParams === 3) {
    // Only with five or more targets, and only alongside the full three size
    // parameters.  Ellipticity is a fourth unknown and the wedge failure that
    // forced the freeParams ladder in the first place came from fitting three
    // to two constraints - releasing a fourth on a thin bulletin would be the
    // same mistake with more arithmetic.  phi is NOT released: it is pinned to
    // the proxy, so this measures how much a free input buys, which is the
    // question worth asking.
    sizeRes = nelderMead(function (p) {
      var a_ = p[0], b_ = p[1], c_ = p[2], d_ = p[3];
      if (a_ < rmLo || a_ > rmHi ||
          !(b_ >= GTCM_X_MIN && b_ <= GTCM_X_MAX) ||
          !(c_ >= GTCM_X_MIN && c_ <= GTCM_X_MAX) ||
          d_ < -GTCM_WN2_E_MAX || d_ > GTCM_WN2_E_MAX) return 1e12;
      return err(a_, b_, c_, ax0, ay0, d_, wn2phi);
    }, [rmc, xc, xc, wn2e],
       [Math.max(rmc * 0.35, 4.0), 0.12, 0.12, 0.08], GTCM_MAX_ITER);
    rm = sizeRes[0][0]; x1 = sizeRes[0][1]; x2 = sizeRes[0][2];
    eFit = clamp(sizeRes[0][3], -GTCM_WN2_E_MAX, GTCM_WN2_E_MAX);
  } else if (freeParams === 3) {
    sizeRes = nelderMead(function (p) {
      var a_ = p[0], b_ = p[1], c_ = p[2];
      if (a_ < rmLo || a_ > rmHi ||
          !(b_ >= GTCM_X_MIN && b_ <= GTCM_X_MAX) ||
          !(c_ >= GTCM_X_MIN && c_ <= GTCM_X_MAX)) return 1e12;
      return err(a_, b_, c_, ax0, ay0, wn2e, wn2phi);
    }, [rmc, xc, xc], [Math.max(rmc * 0.35, 4.0), 0.12, 0.12], GTCM_MAX_ITER);
    rm = sizeRes[0][0]; x1 = sizeRes[0][1]; x2 = sizeRes[0][2];
  } else if (freeParams === 2) {
    sizeRes = nelderMead(function (p) {
      var a_ = p[0], b_ = p[1];
      if (a_ < rmLo || a_ > rmHi ||
          !(b_ >= GTCM_X_MIN && b_ <= GTCM_X_MAX)) return 1e12;
      return err(a_, b_, b_, ax0, ay0, wn2e, wn2phi);
    }, [rmc, xc], [Math.max(rmc * 0.35, 4.0), 0.12], GTCM_MAX_ITER);
    rm = sizeRes[0][0]; x1 = x2 = sizeRes[0][1];
  } else {
    sizeRes = nelderMead(function (p) {
      var a_ = p[0];
      if (a_ < rmLo || a_ > rmHi) return 1e12;
      return err(a_, xc, xc, ax0, ay0, wn2e, wn2phi);
    }, [rmc], [Math.max(rmc * 0.35, 4.0)], GTCM_MAX_ITER);
    rm = sizeRes[0][0]; x1 = x2 = xc;
  }

  // Step 3: release the asymmetry, size parameters fixed.
  var bestE = err(rm, x1, x2, ax0, ay0, eFit, wn2phi);
  var bestAx = ax0, bestAy = ay0;
  if (a > 0.0) {
    var grid = npLinspace(-GTCM_ASYM_MAX_DEV_KT, GTCM_ASYM_MAX_DEV_KT,
                          GTCM_ASYM_STEPS);
    for (var gi = 0; gi < grid.length; gi++) {
      for (var gj = 0; gj < grid.length; gj++) {
        var e = err(rm, x1, x2, ax0 + grid[gi], ay0 + grid[gj], eFit, wn2phi);
        if (e < bestE) { bestE = e; bestAx = ax0 + grid[gi]; bestAy = ay0 + grid[gj]; }
      }
    }
    var asymObj = function (p) {
      var dx = p[0] - ax0, dy = p[1] - ay0;
      if (dx * dx + dy * dy > GTCM_ASYM_MAX_DEV_KT * GTCM_ASYM_MAX_DEV_KT) return 1e12;
      return err(rm, x1, x2, p[0], p[1], eFit, wn2phi);
    };
    var asymRes = nelderMead(asymObj, [bestAx, bestAy], [2.0, 2.0], 80);
    if (asymRes[1] < bestE) {
      bestE = asymRes[1]; bestAx = asymRes[0][0]; bestAy = asymRes[0][1];
    }
  }

  return { rm: rm, ri: ri, x1: x1, x2: x2, ax: bestAx, ay: bestAy,
           a: a, n: nT, freeParams: freeParams,
           e: eFit, phi: wn2phi, eFitted: !!(fitE && freeParams === 3),
           rmc: rmc, xc: xc,
           rms: Math.sqrt(bestE / npSum(wt)) };
}

/** The GTCM wind field for one storm-time.  Port of _buildVortexGTCM().
 *
 *  Returns an object with
 *      magAt(lat, lon)  -> wind speed, kt
 *      dirAt(lat, lon)  -> meteorological direction the wind is FROM, deg
 *      at(lat, lon)     -> {mag, dir, r, r34, az}
 *      r34At(azDeg)     -> modelled 34 kt radius on that bearing, nm
 *      rThresholdAt(azDeg, thrKt, strict)
 *                       -> modelled radius of ANY threshold on that bearing.
 *                          r34At is this with thrKt = 34.  Scoring the fit
 *                          against reported R50 and R64 needs the general
 *                          form, and a second copy of the search is exactly
 *                          the duplication this file exists to prevent.
 *                          `strict` returns NaN where the field never
 *                          reaches the threshold instead of the taper's
 *                          rm*3 fallback - see the note on that fallback.
 *      wn2ScaleAt(azDeg)-> the elongation radius scale on that bearing, 1.0
 *                          unless the wavenumber-2 experiment is enabled
 *      fit              -> the fitGTCM() result
 *
 *  `opts` is forwarded verbatim to fitGTCM(); omitted, the field is exactly
 *  what it was before the experimental terms existed.
 *
 *  Two deliberate departures from the guide, documented rather than
 *  silent, and both must be disclosed in the UI:
 *
 *   * The guide's grids are missing outside the 34 kt radii and NHC leaves
 *     the blend to the receiving office.  This tool inserts into a
 *     background instead, so the profile is tapered exponentially beyond
 *     the modelled 34 kt radius.  A bare Rankine tail decays far too slowly
 *     to terminate on its own.
 *   * Step 4's boundary-layer / land-roughness reduction is NOT
 *     implemented.  It needs the USGS land-surface database.  The field is
 *     therefore marine-exposure everywhere and will be too strong over land.
 *
 *  Peak-core normalisation (NORMALIZE_CORE_PEAK) is NOT applied here.  It
 *  is a property of the raster it is measured on - it rescales relative to
 *  the strongest *sampled* cell - so it belongs to whatever draws the
 *  field, not to the point-wise model.  This is the raw field, which is the
 *  part that has to agree between the two ports. */
function vortexFieldGTCM(snap, opts) {
  var fit = fitGTCM(snap, opts);
  var vmax = Number(snap.vmax);
  var lat = Number(snap.lat);
  var clat = Number(snap.lat), clon = Number(snap.lon);

  // probe = np.linspace(1.0, 900.0, 900)  ->  exactly 1, 2, ... 900 nm.
  //
  // With the elongation experiment on, these are radii in the UNSTRETCHED
  // coordinate rho = r / s(az), not ground radii.  One shared profile still
  // serves every azimuth - that is the point of the scale-covariance note on
  // gtcmProfile() - and the threshold search below converts back by
  // multiplying its answer by s(az).  Ground reach on the long axis is
  // therefore 900 * (1 + e) nm, beyond the probe's nominal span, which is
  // fine: the probe spans rho, which is the space the profile lives in.
  var nProbe = GTCM_R34_PROBE_MAX_NM;
  var prof = new Array(nProbe);
  for (var i = 0; i < nProbe; i++) {
    prof[i] = gtcmProfile(i + 1, vmax, fit.a, fit.rm, fit.ri, fit.x1, fit.x2);
  }
  var sign = (lat >= 0) ? 1.0 : -1.0;
  var amag2 = fit.ax * fit.ax + fit.ay * fit.ay;
  var wn2e = Number(fit.e) || 0.0;
  var wn2phi = Number(fit.phi) || 0.0;

  /** Radius scale on a bearing.  Exactly 1.0 with the experiment off, and
   *  compared with === below so the unstretched path does no arithmetic at
   *  all rather than arithmetic that merely rounds to the same answer. */
  function scaleAt(azDeg) {
    return wn2e ? gtcmWn2Scale(azDeg, wn2e, wn2phi) : 1.0;
  }

  /** rho -> ground radius, at AWIPS grid precision.  Python casts the r34
   *  grid to float32, so fround here rather than leave a systematic sub-nm
   *  offset between the two ports. */
  function scaled(sc, rho) {
    return Math.fround(sc === 1.0 ? rho : sc * rho);
  }

  // Suffix maximum of the profile: sufMax[i] = max(prof[i..end]).  It is
  // non-increasing by construction, which prof itself is NOT: eq. (3) rises
  // linearly from zero at the centre to its peak at rm before it decays, so
  // prof is single-humped over the probe range and a binary search straight
  // on it would be wrong.  (It used to be non-monotonic for a second reason
  // as well - a step at ri from the mis-transcribed continuity factor - but
  // that was a defect and is fixed; the inner rise is real and permanent.)
  // The largest i with prof[i] >= T is the same as the largest i with
  // sufMax[i] >= T, and that one is binary-searchable.
  var sufMax = new Array(nProbe);
  var run = -Infinity;
  for (i = nProbe - 1; i >= 0; i--) {
    if (prof[i] > run) run = prof[i];
    sufMax[i] = run;
  }

  /** The OUTERMOST probe radius still at `thrKt`, not the first crossing:
   *  the profile is also below 34 kt inside the eye, and taking that would
   *  collapse the footprint onto the centre and taper the whole field away.
   *
   *  Python scans all 900 probes for every grid point.  Doing that here
   *  costs ~1.7 s for a 260x220 raster, which is not a redraw a forecaster
   *  will sit through, so the search is narrowed algebraically first and
   *  then confirmed with the same floating-point test Python uses:
   *
   *      |wind|^2 = |a|^2 + V^2 + 2 s k V,   k = ay sin(az) - ax cos(az)
   *
   *  is a quadratic in V, so |wind| >= thr is exactly V >= V*, with
   *  V* = -s k + sqrt(k^2 + thr^2 - |a|^2).  Binary-searching sufMax for V*
   *  lands on the answer or within a bit or two of it; the surrounding
   *  handful of indices are then checked with the literal sqrt(u^2+v^2)
   *  expression, so a last-bit disagreement between the two formulations
   *  cannot move the result.  A full downward scan remains as a fallback
   *  that should never run. */
  function rThresholdAt(azDeg, thrKt, strict) {
    var thr = Number(thrKt);
    var sc = scaleAt(azDeg);
    var azr = azDeg * DEG2RAD;
    var k = fit.ay * Math.sin(azr) - fit.ax * Math.cos(azr);
    // thr * thr, not a literal: at thr = 34 this is exactly 1156.0, so the
    // generalisation cannot move the 34 kt answer by a single bit.
    var disc = k * k + thr * thr - amag2;
    var guess;
    if (disc <= 0) {
      // No real root: |wind| exceeds thr at every radius, asymmetry alone.
      guess = nProbe - 1;
    } else {
      var vStar = -sign * k + Math.sqrt(disc);
      if (vStar <= 0) {
        guess = nProbe - 1;
      } else if (sufMax[0] < vStar) {
        guess = -1;
      } else {
        var lo = 0, hi = nProbe - 1;      // sufMax[lo] >= vStar
        while (lo < hi) {
          var mid = (lo + hi + 1) >> 1;
          if (sufMax[mid] >= vStar) lo = mid; else hi = mid - 1;
        }
        guess = lo;
      }
    }

    var found = -1;
    var from = Math.min(guess + 3, nProbe - 1);
    var to = Math.max(guess - 3, 0);
    for (var j = from; j >= to; j--) {
      if (aboveThreshold(j, azDeg, thr)) { found = j; break; }
    }
    if (found < 0 && guess >= 0) {
      for (var j2 = nProbe - 1; j2 >= 0; j2--) {
        if (aboveThreshold(j2, azDeg, thr)) { found = j2; break; }
      }
    }

    // Interpolate the crossing instead of snapping to the whole-nm probe.
    // probe[found] is the last sample still AT or ABOVE thr, so the field
    // there is >= thr while the taper restarts at exactly thr - the
    // difference shows up as a step at the footprint boundary (3.36 kt on
    // average before this, the largest single source of roughness in the
    // GTCM field).  Solving for the radius where the field equals thr makes
    // it continuous.  Mirrors the same interpolation in _buildVortexGTCM().
    // No crossing anywhere on this bearing.  The field's peak is Vm - a
    // plus the asymmetry projection, so for a fast-moving weakening system
    // this is routine rather than exotic: at Vmax 65 kt with 26 kt of motion
    // the symmetric peak is 52.5 kt and no 64 kt radius exists at any
    // azimuth, whatever the bulletin reported.
    //
    // r34At() must still return SOMETHING - the taper has to start
    // somewhere, and rm*3 is what both ports use - but a caller measuring
    // residuals against reported radii needs to know the difference between
    // "the radius is 175 nm" and "there is no such radius", because scoring
    // the fallback as a radius manufactures agreement or disagreement out of
    // nothing.  `strict` is how it asks.
    if (found < 0) return strict ? NaN : scaled(sc, fit.rm * 3.0);
    var rHi = found + 1;
    if (found >= nProbe - 1) return scaled(sc, rHi);
    var vHi = magAtProbe(found, azDeg);
    var vLo = magAtProbe(found + 1, azDeg);
    var span = vHi - vLo;
    var frac = span > 1e-9 ? (vHi - thr) / span : 0.0;
    if (frac < 0) frac = 0; else if (frac > 1) frac = 1;
    return scaled(sc, rHi + frac);
  }

  /** The 34 kt radius: the case the rest of the tool is built around, and
   *  the one compare_py_js.py checks against _buildVortexGTCM(). */
  function r34At(azDeg) {
    return rThresholdAt(azDeg, 34.0);
  }

  /** Total field magnitude at a probe index, on one bearing. */
  function magAtProbe(idx, azDeg) {
    var uv = gtcmUV(prof[idx], azDeg, fit.ax, fit.ay, lat);
    return Math.sqrt(uv[0] * uv[0] + uv[1] * uv[1]);
  }

  /** The literal test Python applies, bit for bit. */
  function aboveThreshold(idx, azDeg, thrKt) {
    return magAtProbe(idx, azDeg) >= thrKt;
  }

  function at(plat, plon) {
    var db = distBearing(plat, plon, clat, clon);
    var r = db[0], az = db[1];

    // Evaluate the symmetric profile in the unstretched coordinate.  With
    // the experiment off sc is exactly 1.0 and rho is r itself.
    var sc = scaleAt(az);
    var rho = (sc === 1.0) ? r : (r / sc);

    var V = gtcmProfile(rho, vmax, fit.a, fit.rm, fit.ri, fit.x1, fit.x2);
    var uv = gtcmUV(V, az, fit.ax, fit.ay, lat);
    var u = uv[0], v = uv[1];
    var mag = Math.sqrt(u * u + v * v);

    // A GROUND radius: rThresholdAt() has already multiplied by sc.  The
    // taper length therefore stretches with the long axis too, which is the
    // behaviour wanted - an elongated footprint should not terminate on a
    // circular decay scale.
    var r34 = r34At(az);
    var decayL = Math.max(r34 * OUTER_DECAY_FACTOR, MIN_OUTER_DECAY_NM);
    // `r > r34`, matching Python.  r34 is now the interpolated radius where
    // the field equals 34, so the vortex and the taper agree there to within
    // rounding and either comparison gives the same answer; the strict form
    // is kept only so the two ports stay bit-comparable.
    if (r > r34) {
      // Anchor on the field's own value at r34, not a constant 34.  They are
      // the same wherever the field actually reaches 34 kt, since that is how
      // r34 is solved; where it never does, r34 falls back to 3*rm and a
      // constant 34 made the field step UP there.  Mirrors _buildVortexGTCM().
      var Va = gtcmProfile((sc === 1.0) ? r34 : (r34 / sc),
                           vmax, fit.a, fit.rm, fit.ri, fit.x1, fit.x2);
      var uva = gtcmUV(Va, az, fit.ax, fit.ay, lat);
      var anchorV = Math.sqrt(uva[0] * uva[0] + uva[1] * uva[1]);
      mag = anchorV * Math.exp(-(r - r34) / decayL);
    }

    if (GTCM_APPLY_INFLOW) {
      var metFrom = mod360(az + sign * (90.0 - INFLOW_ANGLE_DEG));
      var rad = metFrom * DEG2RAD;
      u = -mag * Math.sin(rad);
      v = -mag * Math.cos(rad);
    } else {
      var base = Math.max(Math.sqrt(u * u + v * v), 1e-6);
      var scale = (mag > 0) ? (mag / base) : 0.0;
      u = u * scale;
      v = v * scale;
    }

    var dir = mod360(Math.atan2(-u, -v) * RAD2DEG);
    return { mag: mag, dir: dir, r: r, r34: r34, az: az, u: u, v: v };
  }

  return {
    fit: fit,
    r34At: r34At,
    rThresholdAt: rThresholdAt,
    wn2ScaleAt: scaleAt,
    at: at,
    magAt: function (plat, plon) { return at(plat, plon).mag; },
    dirAt: function (plat, plon) { return at(plat, plon).dir; }
  };
}


// ===========================================================================
// Track interpolation
// ===========================================================================

/** Linear interpolation of the storm state to an arbitrary valid time.
 *  Port of interpolateTrack(). */
function interpolateTrack(taus, epoch) {
  var lo = taus[0], hi = taus[0], f = 0;
  if (epoch <= taus[0].epoch) {
    lo = hi = taus[0];
  } else if (epoch >= taus[taus.length - 1].epoch) {
    lo = hi = taus[taus.length - 1];
  } else {
    for (var i = 0; i < taus.length - 1; i++) {
      if (taus[i].epoch <= epoch && epoch <= taus[i + 1].epoch) {
        lo = taus[i]; hi = taus[i + 1];
        var span = hi.epoch - lo.epoch;
        f = span > 0 ? (epoch - lo.epoch) / span : 0;
        break;
      }
    }
  }

  var dlon = hi.lon - lo.lon;
  if (dlon > 180) dlon -= 360; else if (dlon < -180) dlon += 360;

  var s = {
    epoch: epoch,
    lat: lo.lat + f * (hi.lat - lo.lat),
    lon: mod360(lo.lon + f * dlon + 180) - 180,
    vmax: lo.vmax + f * (hi.vmax - lo.vmax),
    conf: lo.conf + f * (hi.conf - lo.conf),
    motionDir: lo.motionDir,
    motionSpd: lo.motionSpd + f * (hi.motionSpd - lo.motionSpd),
    // Best-track ground truth, present only on archive records.
    rmw: (lo.rmw != null && hi.rmw != null) ? lo.rmw + f * (hi.rmw - lo.rmw)
       : (f < 0.5 ? lo.rmw : hi.rmw),
    roci: (lo.roci != null && hi.roci != null) ? lo.roci + f * (hi.roci - lo.roci)
        : (f < 0.5 ? lo.roci : hi.roci),
    radii: {}
  };

  // A threshold missing at one end interpolates from zero, so a 64 kt ring
  // that first appears at 24h grows in rather than popping.
  var thrs = [64, 50, 34];
  for (var t = 0; t < thrs.length; t++) {
    var thr = thrs[t];
    var a = dictGet(lo.radii || {}, thr, null) || { NE: 0, SE: 0, SW: 0, NW: 0 };
    var b = dictGet(hi.radii || {}, thr, null) || { NE: 0, SE: 0, SW: 0, NW: 0 };
    var vals = {}, any = false;
    for (var q = 0; q < QUADS.length; q++) {
      var qq = QUADS[q];
      vals[qq] = Number(dictGet(a, qq, 0)) + f * (Number(dictGet(b, qq, 0)) -
                                                  Number(dictGet(a, qq, 0)));
      if (vals[qq] > 0) any = true;
    }
    if (any) s.radii[thr] = vals;
  }
  return s;
}


// ===========================================================================
// JTWC warning parser - port of parseJTWC() in TCWind_JTWC.py
// ===========================================================================
//
// Every regex below is declared once, WITHOUT the /g flag.  A /g RegExp
// carries lastIndex across calls, so re-using one across bulletin lines
// silently skips matches on every other line.  If you ever add /g here,
// reset .lastIndex before each use - or better, don't.
//
// Every `\s+` is a real `\s+`, matching the Python.  A literal space in
// place of one of these is the classic port bug: bulletins are word-wrapped
// at ~72 columns and are full of runs of spaces and mid-phrase line breaks.

var RE_REFDATE  = /\b(\d{2})([A-Z]{3})(\d{2})\b/;
var RE_POSITION = /(\d{6})Z\s*---\s*(?:NEAR\s+)?(\d+(?:\.\d+)?)\s*([NS])\s+(\d+(?:\.\d+)?)\s*([EW])/;
var RE_TAU      = /^\s*(\d+)\s+HRS,\s+VALID AT:/;
var RE_WARNPOS  = /^\s*WARNING POSITION:/;
var RE_WINDS    = /MAX SUSTAINED WINDS\s*-\s*(\d+)\s*KT(?:\s*,\s*GUSTS\s*(\d+)\s*KT)?/;
var RE_RAD_START = /RADIUS OF\s+(\d+)\s*KT WINDS\s*-\s*(\d+)\s*NM\s+(\w+)\s+QUADRANT/;
var RE_RAD_CONT = /^\s*(\d+)\s*NM\s+(\w+)\s+QUADRANT/;
var RE_VECTOR   = /VECTOR TO\s+(\d+)\s*HR POSIT:\s*(\d+)\s*DEG\/\s*(\d+)\s*KTS/;
var RE_MOVEMENT = /MOVEMENT PAST SIX HOURS\s*-\s*(\d+)\s*DEGREES AT\s*(\d+)\s*KTS/;
var RE_REMARKS  = /^\s*REMARKS:/;
var RE_STORM    = /(SUPER TYPHOON|TYPHOON|TROPICAL STORM|TROPICAL DEPRESSION|SUBTROPICAL STORM|SUBTROPICAL DEPRESSION)\s+(\d{1,2}[A-Z])\s*(?:\(([^)]+)\))?/;
var RE_WARNNR   = /WARNING\s+NR\s+(\d+)/;
// `[\s\S]*?` is Python's re.DOTALL `.*?`: "MINIMUM CENTRAL PRESSURE" does
// land split across a line break in real bulletins.
var RE_PRESSURE = /MINIMUM\s+CENTRAL\s+PRESSURE[\s\S]*?(\d+)\s*MB/;
var RE_TRANSITION = /^\s*(SUB|EXTRA)TROPICAL\s*$/;

/** Resolve a DDHHMM group against the bulletin's reference date.
 *  Port of _dtg_to_epoch().
 *
 *  parseInt with an explicit radix 10 on every field: "08" and "09" are
 *  legal decimal here and must not be read as octal by any engine, and a
 *  bare Number("") would be 0 where Python's int("") raises.  The regex
 *  guarantees six digits, so no empty group can reach this.
 *
 *  Date.UTC takes a 0-INDEXED month; calendar.timegm() does not.  Hence
 *  `month - 1`.  Getting that wrong shifts every valid time by a month and
 *  still produces a plausible-looking timeline. */
function dtgToEpoch(ddhhmm, refDay, refMonth, refYear) {
  var dd = parseInt(ddhhmm.substring(0, 2), 10);
  var hh = parseInt(ddhhmm.substring(2, 4), 10);
  var mm = parseInt(ddhhmm.substring(4, 6), 10);

  var month = refMonth, year = refYear;
  if (dd < refDay && (refDay - dd) > 15) {
    month += 1;
    if (month > 12) { month = 1; year += 1; }
  } else if (dd > refDay && (dd - refDay) > 15) {
    month -= 1;
    if (month < 1) { month = 12; year -= 1; }
  }
  return Date.UTC(year, month - 1, dd, hh, mm, 0) / 1000;
}

function emptyQuads() {
  return { NE: 0.0, SE: 0.0, SW: 0.0, NW: 0.0 };
}

/** Great-circle heading (deg) and speed (kt) between two tau positions.
 *  Port of _bearing_speed(); returns [bearingDeg, speedKt]. */
function bearingSpeed(t1, t2) {
  var lat1 = t1.lat * DEG2RAD, lon1 = t1.lon * DEG2RAD;
  var lat2 = t2.lat * DEG2RAD, lon2 = t2.lon * DEG2RAD;
  var dlon = lon2 - lon1;
  var y = Math.sin(dlon) * Math.cos(lat2);
  var x = Math.cos(lat1) * Math.sin(lat2) -
          Math.sin(lat1) * Math.cos(lat2) * Math.cos(dlon);
  var brg = mod360(Math.atan2(y, x) * RAD2DEG);

  var s1 = Math.sin((lat2 - lat1) / 2.0), s2 = Math.sin(dlon / 2.0);
  var a = s1 * s1 + Math.cos(lat1) * Math.cos(lat2) * s2 * s2;
  var dist = 2.0 * EARTH_R_NM * Math.asin(Math.sqrt(clamp(a, 0.0, 1.0)));
  var dt = Math.max(t2.epoch - t1.epoch, 1) / 3600.0;
  return [brg, dist / dt];
}

/** Parse a WTPN warning into a time-ordered list of tau objects.
 *  Returns {taus, header, text}. */
function parseJTWC(text) {
  var lines;
  if (Object.prototype.toString.call(text) === '[object Array]') {
    lines = text.slice();
    text = lines.join('\n');
  } else {
    // Python splits on "\n" only, leaving a trailing "\r" on CRLF input.
    // Every pattern that could see one ends in `\s*$` or is unanchored, so
    // stripping it here changes no result and makes CRLF bulletins behave.
    lines = String(text).split(/\r?\n/);
  }

  // Reference date lives in the remarks block ("27AUG26.").
  var refDay = null, refMonth = null, refYear = null;
  for (var i = 0; i < lines.length; i++) {
    var md = RE_REFDATE.exec(lines[i]);
    if (md && dictHas(MONTHS, md[2])) {
      refDay = parseInt(md[1], 10);
      refMonth = MONTHS[md[2]];
      refYear = 2000 + parseInt(md[3], 10);
      break;
    }
  }
  if (refDay === null) {
    throw new Error('Could not find a DDMMMYY reference date in the bulletin ' +
                    'remarks; cannot resolve DTGs.');
  }

  var taus = [];
  var cur = null;
  var curThreshold = null;
  var inRemarks = false;

  for (var j = 0; j < lines.length; j++) {
    var ln = lines[j];

    if (RE_REMARKS.test(ln)) inRemarks = true;

    if (!inRemarks) {
      if (RE_WARNPOS.test(ln)) {
        cur = newTau(0);
        taus.push(cur);
        curThreshold = null;
        continue;
      }
      var mt = RE_TAU.exec(ln);
      if (mt) {
        cur = newTau(parseInt(mt[1], 10));
        taus.push(cur);
        curThreshold = null;
        continue;
      }
    }

    if (cur === null) continue;
    if (inRemarks) continue;

    var mp = RE_POSITION.exec(ln);
    if (mp && cur.lat === null) {
      cur.epoch = dtgToEpoch(mp[1], refDay, refMonth, refYear);
      var la = parseFloat(mp[2]); if (mp[3] === 'S') la = -la;
      var lo = parseFloat(mp[4]); if (mp[5] === 'W') lo = -lo;
      cur.lat = la; cur.lon = lo;
      continue;
    }

    var mw = RE_WINDS.exec(ln);
    if (mw) {
      cur.vmax = parseFloat(mw[1]);
      if (mw[2]) cur.gust = parseFloat(mw[2]);
      continue;
    }

    var mrs = RE_RAD_START.exec(ln);
    if (mrs) {
      curThreshold = parseInt(mrs[1], 10);
      if (!dictHas(cur.radii, curThreshold)) cur.radii[curThreshold] = emptyQuads();
      var q1 = dictGet(QUAD_WORD, mrs[3].toUpperCase(), null);
      if (q1) cur.radii[curThreshold][q1] = parseFloat(mrs[2]);
      continue;
    }

    var mrc = RE_RAD_CONT.exec(ln);
    if (mrc && curThreshold !== null) {
      var q2 = dictGet(QUAD_WORD, mrc[2].toUpperCase(), null);
      if (q2) cur.radii[curThreshold][q2] = parseFloat(mrc[1]);
      continue;
    }

    var mm2 = RE_MOVEMENT.exec(ln);
    if (mm2) {
      cur.motionDir = parseFloat(mm2[1]);
      cur.motionSpd = parseFloat(mm2[2]);
      continue;
    }

    var mv = RE_VECTOR.exec(ln);
    if (mv) {
      // "VECTOR TO 24 HR POSIT" appears in the 12 HR block and describes
      // motion out of that block.
      cur.motionDir = parseFloat(mv[2]);
      cur.motionSpd = parseFloat(mv[3]);
      continue;
    }

    if (ln.indexOf('BECOMING SUBTROPICAL') >= 0 ||
        ln.indexOf('BECOMING EXTRATROPICAL') >= 0) {
      cur.conf = CONF_BECOMING;
    } else if (RE_TRANSITION.test(ln)) {
      cur.conf = CONF_SUBTROPICAL;
    }
  }

  // Drop anything incomplete, then order by valid time.
  taus = taus.filter(function (t) {
    return t.lat !== null && t.epoch !== null && t.vmax !== null;
  });
  taus.sort(function (a, b) { return a.epoch - b.epoch; });

  // Once a system is flagged subtropical it stays that way downstream.
  var worst = CONF_TROPICAL;
  for (var k = 0; k < taus.length; k++) {
    worst = Math.min(worst, taus[k].conf);
    taus[k].conf = worst;
  }

  // Backfill motion where a block had no vector line.
  for (var n = 0; n < taus.length; n++) {
    if (taus[n].motionSpd === null) {
      if (n + 1 < taus.length) {
        var bs = bearingSpeed(taus[n], taus[n + 1]);
        taus[n].motionDir = bs[0];
        taus[n].motionSpd = bs[1];
      } else if (n > 0) {
        taus[n].motionDir = taus[n - 1].motionDir;
        taus[n].motionSpd = taus[n - 1].motionSpd;
      } else {
        taus[n].motionDir = 0.0;
        taus[n].motionSpd = 0.0;
      }
    }
  }

  var full = lines.join('\n');
  var header = {
    refDate: [refDay, refMonth, refYear],
    systemType: null, stormId: null, stormName: null,
    warningNumber: null, pressureMb: null
  };

  var ms = RE_STORM.exec(full);
  if (ms) {
    header.systemType = ms[1];
    header.stormId = ms[2];
    // Python's unmatched optional group is None, not "".
    header.stormName = (ms[3] === undefined) ? null : ms[3];
  }
  var mn = RE_WARNNR.exec(full);
  if (mn) header.warningNumber = parseInt(mn[1], 10);
  var mpr = RE_PRESSURE.exec(full);
  if (mpr) header.pressureMb = parseInt(mpr[1], 10);

  return { header: header, taus: taus, text: text };
}

function newTau(tau) {
  return { tau: tau, epoch: null, lat: null, lon: null, vmax: null,
           gust: null, radii: {}, motionDir: null, motionSpd: null,
           conf: CONF_TROPICAL };
}

/** Short human label for a parsed system.  Port of describeStorm(). */
function describeStorm(header) {
  var bits = [];
  if (header.systemType) bits.push(header.systemType);
  if (header.stormId) bits.push(header.stormId);
  if (header.stormName) bits.push('(' + header.stormName + ')');
  var label = bits.length ? bits.join(' ') : 'unidentified system';
  if (header.warningNumber !== null && header.warningNumber !== undefined) {
    label += ' warning ' + header.warningNumber;
  }
  return label;
}
